name: Publish APK to GitHub Releases

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "WiFi PM Helper v1.3.0 (Dukungan 9Router API & Gemini Direct di HP Fisik)"
          body: |
            ### Download APK WiFi PM Helper v1.3.0 (CGK Terminal 3)
            Klik file **`WiFi-PM-Helper-v1.3.0.apk`** di bawah bagian **Assets** untuk mengunduh dan menginstal versi terbaru.
            
            **Pembaruan v1.3.0:**
            - **Integrasi Penuh 9Router API (OpenAI-Compatible) & Gemini API Direct**: Atasi timeout Firebase App Check di HP fisik dengan menghubungkan Base URL, API Key, dan Model dari 9Router milikmu langsung lewat tombol **"Atur API"** di pojok kanan atas.
            - **Auto-Fetch Model 9Router**: Tersedia tombol *"Cek Koneksi & Ambil Daftar Model"* untuk mengambil daftar model dari `/v1/models` secara otomatis.
            - Desain UI/UX bersih, Kolase 4 Foto Jadi 1 (`< 1 MB`), & Generator Today Report CGK.
          files: release/WiFi-PM-Helper-v1.3.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
