name: Publish APK to GitHub Releases

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "WiFi PM Helper v1.0.0 (APK Siap Install)"
          body: |
            ### Download APK WiFi PM Helper (CGK Terminal 3)
            Klik file **`WiFi-PM-Helper-v1.0.apk`** di bawah bagian **Assets** untuk langsung mengunduh dan menginstal aplikasi di HP Android Anda.
            
            **Fitur:**
            - Auto-Deteksi Speedtest dengan AI (`Up / Down Mbps`)
            - Kolase 4 Foto Jadi 1 (`< 1 MB`) dengan Label Lokasi & Tanggal
            - Generator `REPORT DAILY ROUTINE PREVENTIVE MAINTENANCE` & `*ICT OPERATION DAILY REPORT (CGK).`
          files: release/WiFi-PM-Helper-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
