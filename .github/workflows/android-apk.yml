name: Publish APK to GitHub Releases

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0
          name: "WiFi PM Helper v2.2.0 (Deteksi Lokasi Otomatis dari Foto 1 + Referensi NAS + GPS)"
          body: |
            ### Download APK WiFi PM Helper v2.2.0 (CGK)
            Klik file **`WiFi-PM-Helper-v2.2.0.apk`** di bawah bagian **Assets** untuk mengunduh dan menginstal versi terbaru.
            
            **Pembaruan v2.2.0:**
            - **v2.2.0**: Deteksi Lokasi Otomatis dari Foto 1 menggunakan AI + referensi lokasi di NAS + GPS untuk mempersempit kandidat.
          files: release/WiFi-PM-Helper-v2.2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
