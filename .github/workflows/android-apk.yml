name: Publish APK to GitHub Releases

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.1
          name: "WiFi PM Helper v2.1.1 (Fix UI Deteksi s/d 10 Foto/Screenshot CM by AI + CGK)"
          body: |
            ### Download APK WiFi PM Helper v2.1.1 (CGK)
            Klik file **`WiFi-PM-Helper-v2.1.1.apk`** di bawah bagian **Assets** untuk mengunduh dan menginstal versi terbaru.
            
            **Pembaruan v2.1.1:**
            - **Perbaikan Tampilan Kartu Deteksi Foto / Screenshot CM by AI**: Merapikan tata letak teks judul, deskripsi, dan tombol pada dialog *Tambah / Edit Corrective Maintenance* agar bersih dan proporsional.
            - **Upload s/d 10 Foto / Screenshot untuk Deteksi Corrective Maintenance (CM) by AI**: Mendukung pemilihan **1 hingga 10 screenshot/foto sekaligus**, lengkap dengan deretan *thumbnail* `#1..#10` dan pengisian 7 kolom CM otomatis.
          files: release/WiFi-PM-Helper-v2.1.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
